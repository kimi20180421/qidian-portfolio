<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>视觉项目 | UX 屈畅 · 个人作品集</title>
  <style>
    :root {
      --nav-active-fg: #1763C8;
      --nav-active-bg: rgba(74, 169, 255, .18);
      --nav-hover-bg: rgba(74, 169, 255, .12);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      -webkit-text-size-adjust: 100%;
              text-size-adjust: 100%;
    }

    body {
      margin: 0;
      color: #1f2329;
      font-weight: 400;
      font-size: 16px;
      font-family: -apple-system, BlinkMacSystemFont, Helvetica Neue, Arial, Segoe UI, PingFang SC, Microsoft Yahei, Hiragino Sans GB, sans-serif, Apple Color Emoji, Segoe UI Emoji, Segoe UI Symbol, Noto Color Emoji;
      background: #F7F4FF;
      min-height: 100vh;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .page {
      min-height: 100vh;
      overflow: visible;
    }

    .nav {
      position: sticky;
      top: 0;
      z-index: 20;
      display: grid;
      grid-template-columns: max-content minmax(0, 1fr) max-content;
      align-items: center;
      column-gap: 20px;
      height: 60px;
      padding: 0 max(24px, calc((100vw - 1440px) / 2));
      background: rgba(255, 255, 255, .86);
      border-bottom: 1px solid rgba(122, 77, 255, .12);
      backdrop-filter: blur(18px) saturate(1.16);
      -webkit-backdrop-filter: blur(18px) saturate(1.16);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #1f2329;
      font-size: 18px;
      font-weight: 500;
      white-space: nowrap;
    }

    .brand-mark {
      display: block;
      width: 28px;
      height: 28px;
      flex-shrink: 0;
    }

    .nav-links {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: max-content;
      min-width: 0;
      justify-self: center;
      font-size: 18px;
    }

    .nav-links span,
    .nav-links a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      width: 96px;
      height: 38px;
      padding: 0;
      border-radius: 999px;
      white-space: nowrap;
      color: #1f2329;
      transition:
        color .18s ease,
        background-color .18s ease;
    }

    .nav-links .nav-wide {
      width: 144px;
    }

    .nav-links span:hover,
    .nav-links a:hover {
      color: var(--nav-active-fg);
      background: var(--nav-hover-bg);
    }

    .nav-links .active {
      color: var(--nav-active-fg);
      background: var(--nav-active-bg);
      font-weight: 500;
    }

    .download {
      display: flex;
      align-items: center;
      gap: 8px;
      justify-self: end;
      color: #1f2329;
      font-size: 14px;
      font-weight: 400;
      white-space: nowrap;
    }

    .download::before {
      content: "";
      width: 12px;
      height: 12px;
      border-radius: 2px;
      background: #d9d9d9;
    }

    .visual-stack {
      width: 100%;
      padding: 0;
      margin: 0;
    }

    .section-anchor-nav {
      position: fixed;
      top: 132px;
      left: 20px;
      z-index: 18;
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 180px;
      max-height: calc(100vh - 160px);
      padding: 10px 8px;
      border: 0;
      border-radius: 20px;
      background: transparent;
      box-shadow: none;
      opacity: 0;
      transform: translateX(-12px);
      overflow-y: auto;
      pointer-events: none;
      transition:
        opacity .24s cubic-bezier(0.22, 1, 0.36, 1),
        transform .24s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .section-anchor-nav.is-visible {
      opacity: 1;
      transform: translateX(0);
      pointer-events: auto;
    }

    .section-anchor-item {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 34px;
      padding: 0 10px;
      border-radius: 12px;
      color: rgba(255, 255, 255, .68);
      cursor: pointer;
      transition:
        background-color .24s cubic-bezier(0.22, 1, 0.36, 1),
        color .24s cubic-bezier(0.22, 1, 0.36, 1);
      user-select: none;
    }

    .section-anchor-item:hover {
      background: rgba(74, 169, 255, .16);
      color: rgba(255, 255, 255, .92);
    }

    .section-anchor-item.is-active {
      color: #88DCFF;
    }

    .section-anchor-item.is-active .section-anchor-text {
      font-weight: 500;
    }

    .section-anchor-dot {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .28);
      flex-shrink: 0;
      transition:
        background-color .24s cubic-bezier(0.22, 1, 0.36, 1),
        transform .24s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .section-anchor-item.is-active .section-anchor-dot {
      background: #88DCFF;
      transform: scale(1.16);
    }

    .section-anchor-text {
      min-width: 0;
      font-size: 14px;
      line-height: 22px;
      color: inherit;
      white-space: normal;
      overflow-wrap: anywhere;
    }

    .section-anchor-item-sub {
      padding-left: 20px;
    }

    .slice-block {
      position: relative;
      display: flex;
      justify-content: center;
      margin: 0;
      padding: 0;
    }

    .slice-anchor-point {
      position: absolute;
      top: var(--anchor-top, 0);
      left: 50%;
      width: 1px;
      height: 1px;
      transform: translateX(-560px);
      pointer-events: none;
    }

    .slice-block::before {
      content: "";
      position: absolute;
      z-index: 0;
      top: 0;
      left: 50%;
      width: 1120px;
      max-width: 100%;
      height: 100%;
      background: #DEE0E3;
      transform: translateX(-50%);
      opacity: 1;
      transition: opacity .24s cubic-bezier(0.22, 1, 0.36, 1);
      pointer-events: none;
    }

    .slice-block.is-loaded::before {
      opacity: 0;
    }

    .slice-img {
      position: relative;
      z-index: 1;
      display: block;
      width: 1120px;
      max-width: 100%;
      height: auto;
      margin: 0;
      padding: 0;
      border: 0;
      opacity: 0;
      transition: opacity .24s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .slice-block.is-loaded .slice-img {
      opacity: 1;
    }

    .bg-1,
    .bg-2,
    .bg-3,
    .bg-4,
    .bg-5,
    .bg-6,
    .bg-7,
    .bg-8,
    .bg-9,
    .bg-10,
    .bg-11,
    .bg-12,
    .bg-13,
    .bg-14,
    .bg-15,
    .bg-16,
    .bg-17,
    .bg-18,
    .bg-19,
    .bg-20,
    .bg-21,
    .bg-22,
    .bg-23 {
      background: #000;
    }

    .contact-fab {
      position: fixed;
      z-index: 30;
      right: clamp(12px, 2vw, 30px);
      top: 58%;
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .contact-tab {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      width: 58px;
      padding: 10px 10px 18px;
      color: #fff;
      font-size: 16px;
      font-weight: 400;
      line-height: 1.2;
      border-radius: 999px;
      background: linear-gradient(180deg, #F0EBFF 0%, #B39DFF 52%, #7A4DFF 100%);
      box-shadow: 0 18px 32px rgba(122, 77, 255, .18);
      transition:
        transform .24s cubic-bezier(0.22, 1, 0.36, 1),
        box-shadow .24s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .contact-fab.is-hovering-tab .contact-tab,
    .contact-fab.is-open .contact-tab {
      transform: translateY(-4px);
      box-shadow: 0 24px 38px rgba(122, 77, 255, .24);
    }

    .contact-avatar {
      display: block;
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255,255,255,.75);
      border-radius: 50%;
      background: #F0EBFF;
      user-select: none;
      -webkit-user-drag: none;
    }

    .contact-popover {
      position: relative;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      width: fit-content;
      padding: 20px;
      border-radius: 22px;
      background: rgba(255, 255, 255, .5);
      border: 1px solid rgba(255, 255, 255, .68);
      box-shadow:
        0 22px 54px rgba(122, 77, 255, .12),
        inset 0 1px 0 rgba(255, 255, 255, .74);
      backdrop-filter: blur(18px) saturate(1.16);
      -webkit-backdrop-filter: blur(18px) saturate(1.16);
      opacity: 0;
      visibility: hidden;
      transform: translate3d(16px, 0, 0) scale(.97);
      transform-origin: right center;
      pointer-events: none;
      transition:
        opacity .24s cubic-bezier(0.22, 1, 0.36, 1),
        transform .24s cubic-bezier(0.22, 1, 0.36, 1),
        visibility .24s linear;
    }

    .contact-fab.is-hovering-tab .contact-popover,
    .contact-fab.is-open .contact-popover {
      opacity: 1;
      visibility: visible;
      transform: translate3d(0, 0, 0) scale(1);
      pointer-events: auto;
    }

    .contact-popover-copy {
      width: 155px;
      color: #000;
      font-size: 14px;
      line-height: 1.7;
      text-align: left;
    }

    .contact-phone {
      display: inline-block;
      margin-top: 2px;
      color: #000;
      font-weight: 500;
      letter-spacing: .02em;
    }

    .contact-qr {
      margin-top: 8px;
      width: 155px;
      padding: 0;
      border-radius: 16px;
      background: rgba(255, 255, 255, .56);
      border: 1px solid rgba(255, 255, 255, .7);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .76);
      overflow: hidden;
    }

    .contact-qr img {
      display: block;
      width: 155px;
      height: auto;
      border-radius: 12px;
      background: #fff;
    }

    @media (max-width: 960px) {
      .section-anchor-nav {
        display: none;
      }

      .nav {
        grid-template-columns: 1fr;
        row-gap: 12px;
        height: auto;
        padding-top: 18px;
        padding-bottom: 18px;
      }

      .brand,
      .nav-links,
      .download {
        justify-self: center;
      }

      .nav-links {
        gap: 10px;
        font-size: 14px;
      }

      .nav-links span,
      .nav-links a {
        width: 96px;
      }

      .nav-links .nav-wide {
        width: 144px;
      }

      .contact-fab {
        top: auto;
        bottom: 20px;
        gap: 14px;
      }

      .contact-tab {
        width: 54px;
        padding: 8px 8px 14px;
        font-size: 16px;
      }

      .contact-popover {
        padding: 20px;
      }
    }
  </style>
</head>

  <script>
    (function() {
      var contactFab = document.querySelector('.contact-fab');
      if (!contactFab) return;
      var contactTrigger = contactFab.querySelector('.contact-tab');
      if (!contactTrigger) return;

      function setContactOpen(isOpen) {
        contactFab.classList.toggle('is-open', isOpen);
        contactTrigger.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
      }

      contactTrigger.addEventListener('click', function(event) {
        event.preventDefault();
        setContactOpen(!contactFab.classList.contains('is-open'));
      });

      contactTrigger.addEventListener('mouseenter', function() {
        if (!contactFab.classList.contains('is-open')) {
          contactFab.classList.add('is-hovering-tab');
        }
      });

      contactTrigger.addEventListener('mouseleave', function() {
        contactFab.classList.remove('is-hovering-tab');
      });

      document.addEventListener('click', function(event) {
        if (!contactFab.contains(event.target)) {
          setContactOpen(false);
        }
      });

      document.addEventListener('keydown', function(event) {
        if (event.key === 'Escape') {
          setContactOpen(false);
        }
      });
    })();

    (function() {
      var anchorNav = document.getElementById('sectionAnchorNav');
      if (!anchorNav) return;

      var items = Array.prototype.slice.call(anchorNav.querySelectorAll('[data-anchor-target]'));
      if (!items.length) return;

      var targets = items.map(function(item) {
        var section = document.getElementById(item.getAttribute('data-anchor-target'));
        return {
          item: item,
          section: section
        };
      }).filter(function(entry) {
        return !!entry.section;
      });

      if (!targets.length) return;

      function getPageTop(section) {
        return section.getBoundingClientRect().top + window.scrollY;
      }

      function setActive(targetId) {
        targets.forEach(function(entry) {
          entry.item.classList.toggle('is-active', entry.section.id === targetId);
        });
      }

      function updateAnchorState() {
        var probeY = window.scrollY + 136;
        var viewportBottom = window.scrollY + window.innerHeight;
        var documentHeight = Math.max(document.body.scrollHeight, document.documentElement.scrollHeight);
        var currentId = targets[0].section.id;

        targets.forEach(function(entry) {
          if (getPageTop(entry.section) <= probeY) {
            currentId = entry.section.id;
          }
        });

        if (viewportBottom >= documentHeight - 2) {
          currentId = targets[targets.length - 1].section.id;
        }

        setActive(currentId);

        if (window.scrollY > 120) {
          anchorNav.classList.add('is-visible');
        } else {
          anchorNav.classList.remove('is-visible');
        }
      }

      targets.forEach(function(entry) {
        entry.item.addEventListener('click', function() {
          var top = getPageTop(entry.section) - 84;
          window.scrollTo({
            top: top < 0 ? 0 : top,
            behavior: 'smooth'
          });
        });
      });

      window.addEventListener('scroll', updateAnchorState, { passive: true });
      window.addEventListener('resize', updateAnchorState);
      updateAnchorState();
    })();

    (function() {
      var sliceImages = document.querySelectorAll('.slice-img');
      sliceImages.forEach(function(image) {
        var block = image.closest('.slice-block');
        if (!block) return;

        function setLoaded() {
          block.classList.add('is-loaded');
        }

        if (image.complete && image.naturalWidth > 0) {
          setLoaded();
        } else {
          image.addEventListener('load', setLoaded, { once: true });
          image.addEventListener('error', setLoaded, { once: true });
        }
      });
    })();
  </script>
</body>
</html>
