<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>视觉项目 | UX 屈畅 · 个人作品集</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      -webkit-text-size-adjust: 100%;
              text-size-adjust: 100%;
    }

    body {
      margin: 0;
      color: #1f2329;
      font-weight: 400;
      font-size: 16px;
      font-family: -apple-system, BlinkMacSystemFont, Helvetica Neue, Arial, Segoe UI, PingFang SC, Microsoft Yahei, Hiragino Sans GB, sans-serif, Apple Color Emoji, Segoe UI Emoji, Segoe UI Symbol, Noto Color Emoji;
      background: #F7F4FF;
      min-height: 100vh;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .page {
      min-height: 100vh;
      overflow: hidden;
    }

    .nav {
      position: sticky;
      top: 0;
      z-index: 20;
      display: grid;
      grid-template-columns: max-content minmax(0, 1fr) max-content;
      align-items: center;
      column-gap: 20px;
      height: 60px;
      padding: 0 max(24px, calc((100vw - 1440px) / 2));
      background: rgba(255, 255, 255, .86);
      border-bottom: 1px solid rgba(122, 77, 255, .12);
      backdrop-filter: blur(18px) saturate(1.16);
      -webkit-backdrop-filter: blur(18px) saturate(1.16);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #1f2329;
      font-size: 18px;
      font-weight: 500;
      white-space: nowrap;
    }

    .brand-mark {
      position: relative;
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: linear-gradient(136deg, #9363f4 10%, #e885d8 105%);
      box-shadow: 2px 4px 10px rgba(212, 99, 243, .27);
    }

    .brand-mark::after {
      content: "";
      position: absolute;
      top: 2px;
      right: 3px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #88dcff;
    }

    .nav-links {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      width: max-content;
      min-width: 0;
      justify-self: center;
      font-size: 18px;
    }

    .nav-links span,
    .nav-links a {
      display: inline-flex;
      align-items: center;
      flex-shrink: 0;
      height: 38px;
      padding: 0 14px;
      border-radius: 999px;
      white-space: nowrap;
      color: #1f2329;
    }

    .nav-links .active {
      color: #4d32ce;
      background: #eee9ff;
    }

    .download {
      display: flex;
      align-items: center;
      gap: 8px;
      justify-self: end;
      color: #1f2329;
      font-size: 14px;
      font-weight: 400;
      white-space: nowrap;
    }

    .download::before {
      content: "";
      width: 12px;
      height: 12px;
      border-radius: 2px;
      background: #d9d9d9;
    }

    .visual-stack {
      width: 100%;
      padding: 0;
      margin: 0;
    }

    .slice-block {
      display: flex;
      justify-content: center;
      margin: 0;
      padding: 0;
    }

    .slice-img {
      display: block;
      width: 1120px;
      max-width: 100%;
      height: auto;
      margin: 0;
      padding: 0;
      border: 0;
    }

    .bg-1 { background: #93D2F4; }
    .bg-2 { background: #FFFFFF; }
    .bg-3 { background: #E8F8FF; }
    .bg-4 { background: #99D3FE; }
    .bg-5 { background: #73C9FE; }
    .bg-6 { background: #B8E7F7; }
    .bg-7 { background: #C3FAF8; }
    .bg-8 { background: #E8F8FF; }
    .bg-9 { background: #E8F8FF; }
    .bg-10 { background: #98A0E8; }
    .bg-11 { background: #FFFFFF; }
    .bg-12 { background: #E8F8FF; }
    .bg-13 { background: #E8F8FF; }
    .bg-14 { background: #A0CFF7; }
    .bg-15 { background: #E9ECF6; }
    .bg-16 { background: #51B4F7; }
    .bg-17 { background: #6CDAF7; }
    .bg-18 { background: #8CEDEF; }
    .bg-19 { background: #79E6DE; }
    .bg-20 { background: #FFFFFF; }
    .bg-21 { background: #A6D9EE; }
    .bg-22 { background: #C4E7F5; }
    .bg-23 { background: #B2E1EB; }

    @media (max-width: 960px) {
      .nav {
        grid-template-columns: 1fr;
        row-gap: 12px;
        height: auto;
        padding-top: 18px;
        padding-bottom: 18px;
      }

      .brand,
      .nav-links,
      .download {
        justify-self: center;
      }

      .nav-links {
        gap: 8px;
        font-size: 14px;
      }
    }
  </style>
</head>
