<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>百度网盘-体验设计升级 | UX 屈畅 · 个人作品集</title>
  <style>
    :root {
      --purple: #4408a6;
      --purple-2: #7a4dff;
      --ink: #1f2329;
      --muted: #5f6270;
      --nav-active-fg: #4d32ce;
      --nav-active-bg: #eee9ff;
      --nav-hover-bg: rgba(238, 233, 255, .64);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      -webkit-text-size-adjust: 100%;
              text-size-adjust: 100%;
    }

    body {
      margin: 0;
      color: var(--ink);
      font-weight: 400;
      font-size: 16px;
      font-family: -apple-system, BlinkMacSystemFont, Helvetica Neue, Arial, Segoe UI, PingFang SC, Microsoft Yahei, Hiragino Sans GB, sans-serif, Apple Color Emoji, Segoe UI Emoji, Segoe UI Symbol, Noto Color Emoji;
      background: url("assets/figma-portfolio/bg-gradient.png") center top / cover fixed no-repeat, #f3f0ff;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .page {
      position: relative;
      overflow: hidden;
      min-height: 100vh;
    }

    .nav {
      position: relative;
      z-index: 10;
      display: grid;
      grid-template-columns: max-content minmax(0, 1fr) max-content;
      align-items: center;
      column-gap: 20px;
      height: 60px;
      padding: 0 max(24px, calc((100vw - 1440px) / 2));
      background: transparent;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 600;
      color: var(--ink);
      font-size: 18px;
      justify-self: start;
      white-space: nowrap;
    }

    .brand-mark {
      display: block;
      width: 28px;
      height: 28px;
      flex-shrink: 0;
    }

    .nav-links {
      display: flex;
      flex-wrap: nowrap;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 18px;
      min-width: 0;
      width: max-content;
      justify-self: center;
    }

    .nav-links span,
    .nav-links a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      width: 96px;
      height: 38px;
      padding: 0;
      border-radius: 999px;
      white-space: nowrap;
      color: var(--ink);
      transition:
        color .18s ease,
        background-color .18s ease;
    }

    .nav-links .nav-wide {
      width: 144px;
    }

    .nav-links span:hover,
    .nav-links a:hover {
      color: var(--nav-active-fg);
      background: var(--nav-hover-bg);
    }

    .nav-links span.active {
      color: var(--nav-active-fg);
      background: var(--nav-active-bg);
      font-weight: 500;
    }

    .download {
      display: none;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 400;
      color: var(--ink);
      justify-self: end;
      white-space: nowrap;
    }

    .download::before {
      content: "";
      width: 12px;
      height: 12px;
      border-radius: 2px;
      background: #d9d9d9;
    }

    .detail-main {
      min-height: calc(100vh - 60px);
      padding: 0 max(80px, calc((100vw - 1440px) / 2));
      background: url("assets/figma-portfolio/Mask group (1).png") top center / 100% auto no-repeat;
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="nav">
      <a class="brand" href="index.html">
        <img class="brand-mark" src="assets/figma-portfolio/logo.png" width="28" height="28" alt="" aria-hidden="true" decoding="async" />
        <span>UX 屈畅 · 个人作品集</span>
      </a>
      <span class="nav-links">
        <a href="index.html">首页</a>
        <span class="active">UX 项目</span>
        <span>视觉项目</span>
        <a class="nav-wide" href="project-more.html">更多设计实践</a>
        <a href="index.html#experience">关于我</a>
      </span>
      <span class="download">下载 PDF 作品集</span>
    </header>
    <main class="detail-main"></main>
  </div>
</body>
</html>
