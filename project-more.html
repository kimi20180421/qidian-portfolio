<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>更多设计实践 | UX 屈畅 · 个人作品集</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      -webkit-text-size-adjust: 100%;
              text-size-adjust: 100%;
    }

    body {
      margin: 0;
      color: #1f2329;
      font-weight: 400;
      font-size: 16px;
      font-family: -apple-system, BlinkMacSystemFont, Helvetica Neue, Arial, Segoe UI, PingFang SC, Microsoft Yahei, Hiragino Sans GB, sans-serif, Apple Color Emoji, Segoe UI Emoji, Segoe UI Symbol, Noto Color Emoji;
      background: #fff;
      min-height: 100vh;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .page {
      min-height: 100vh;
      overflow: visible;
      background: #fff;
    }

    .nav {
      position: sticky;
      top: 0;
      z-index: 20;
      display: grid;
      grid-template-columns: max-content minmax(0, 1fr) max-content;
      align-items: center;
      column-gap: 20px;
      height: 60px;
      padding: 0 max(24px, calc((100vw - 1440px) / 2));
      background: rgba(255, 255, 255, .9);
      border-bottom: 1px solid rgba(122, 77, 255, .12);
      backdrop-filter: blur(18px) saturate(1.16);
      -webkit-backdrop-filter: blur(18px) saturate(1.16);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #1f2329;
      font-size: 18px;
      font-weight: 500;
      white-space: nowrap;
    }

    .brand-mark {
      display: block;
      width: 28px;
      height: 28px;
      flex-shrink: 0;
    }

    .nav-links {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: max-content;
      min-width: 0;
      justify-self: center;
      font-size: 18px;
    }

    .nav-links span,
    .nav-links a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      width: 96px;
      height: 38px;
      padding: 0;
      border-radius: 999px;
      white-space: nowrap;
      color: #1f2329;
      transition:
        color .18s ease,
        background-color .18s ease;
    }

    .nav-links .nav-wide {
      width: 144px;
    }

    .nav-links span:hover,
    .nav-links a:hover {
      color: #4408A6;
      background: rgba(122, 77, 255, .08);
    }

    .nav-links .active {
      color: #4408A6;
      background: rgba(122, 77, 255, .12);
      font-weight: 500;
    }

    .download {
      display: flex;
      align-items: center;
      gap: 8px;
      justify-self: end;
      color: #1f2329;
      font-size: 14px;
      font-weight: 400;
      white-space: nowrap;
    }

    .download::before {
      content: "";
      width: 12px;
      height: 12px;
      border-radius: 2px;
      background: #d9d9d9;
    }

    .section-anchor-nav {
      position: fixed;
      top: 132px;
      left: 20px;
      z-index: 18;
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 180px;
      max-height: calc(100vh - 160px);
      padding: 10px 8px;
      border: 0;
      border-radius: 20px;
      background: transparent;
      box-shadow: none;
      opacity: 0;
      transform: translateX(-12px);
      overflow-y: auto;
      pointer-events: none;
      transition:
        opacity .24s cubic-bezier(0.22, 1, 0.36, 1),
        transform .24s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .section-anchor-nav.is-visible {
      opacity: 1;
      transform: translateX(0);
      pointer-events: auto;
    }

    .section-anchor-item {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 34px;
      padding: 0 10px;
      border-radius: 12px;
      color: rgba(31, 35, 41, .58);
      cursor: pointer;
      transition:
        background-color .24s cubic-bezier(0.22, 1, 0.36, 1),
        color .24s cubic-bezier(0.22, 1, 0.36, 1);
      user-select: none;
    }

    .section-anchor-item:hover {
      background: rgba(122, 77, 255, .08);
      color: rgba(31, 35, 41, .86);
    }

    .section-anchor-item.is-active {
      color: #4408A6;
    }

    .section-anchor-item.is-active .section-anchor-text {
      font-weight: 500;
    }

    .section-anchor-dot {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: rgba(31, 35, 41, .22);
      flex-shrink: 0;
      transition:
        background-color .24s cubic-bezier(0.22, 1, 0.36, 1),
        transform .24s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .section-anchor-item.is-active .section-anchor-dot {
      background: #4408A6;
      transform: scale(1.16);
    }

    .section-anchor-text {
      min-width: 0;
      font-size: 14px;
      line-height: 20px;
      font-weight: 400;
    }

    .more-stack {
      width: 100%;
      padding: 0 0 72px;
      margin: 0;
      background: #fff;
    }

    .more-block {
      position: relative;
      display: flex;
      justify-content: center;
      width: 100%;
      margin: 0;
      padding: 0;
      background: #fff;
    }

    .more-anchor-point {
      position: absolute;
      top: 0;
      left: 50%;
      width: 1px;
      height: 1px;
      transform: translateX(-50%);
      scroll-margin-top: 84px;
      pointer-events: none;
    }

    .more-img {
      display: block;
      width: 1120px;
      max-width: 100%;
      height: auto;
      margin: 0;
      padding: 0;
      border: 0;
    }

    @media (max-width: 1280px) {
      .nav-links {
        gap: 10px;
      }

      .nav-links span,
      .nav-links a {
        width: 96px;
      }

      .nav-links .nav-wide {
        width: 144px;
      }
    }

    @media (max-width: 1120px) {
      .section-anchor-nav {
        top: 96px;
        left: 22px;
        gap: 8px;
        width: 64px;
        max-height: calc(100vh - 120px);
        padding: 0;
        border-radius: 0;
        overflow: visible;
      }

      .section-anchor-item {
        position: relative;
        justify-content: flex-start;
        width: 64px;
        min-height: 12px;
        padding: 0;
        border-radius: 0;
        background: transparent;
      }

      .section-anchor-item:hover {
        background: transparent;
      }

      .section-anchor-dot {
        width: 10px;
        height: 3px;
        border-radius: 999px;
        background: rgba(31, 35, 41, .22);
        transform-origin: left center;
        transition:
          width .24s cubic-bezier(0.22, 1, 0.36, 1),
          background-color .24s cubic-bezier(0.22, 1, 0.36, 1);
      }

      .section-anchor-item:hover .section-anchor-dot {
        width: 30px;
        background: #4408A6;
      }

      .section-anchor-item.is-active .section-anchor-dot {
        width: 52px;
        background: #4408A6;
        transform: none;
      }

      .section-anchor-item.is-near-1 .section-anchor-dot {
        width: 40px;
      }

      .section-anchor-item.is-near-2 .section-anchor-dot {
        width: 28px;
      }

      .section-anchor-item.is-near-3 .section-anchor-dot {
        width: 16px;
      }

      .section-anchor-item:not(.is-active):hover .section-anchor-dot {
        width: 30px;
      }

      .section-anchor-text {
        position: absolute;
        top: 50%;
        left: 74px;
        z-index: 22;
        display: block;
        min-width: 168px;
        max-width: 260px;
        padding: 12px 14px;
        border: 1px solid rgba(31, 35, 41, .12);
        border-radius: 16px;
        color: #1f2329;
        font-size: 14px;
        line-height: 20px;
        font-weight: 500;
        white-space: nowrap;
        background: rgba(255, 255, 255, .96);
        box-shadow: 0 18px 42px rgba(31, 35, 41, .12);
        opacity: 0;
        transform: translate(-8px, -50%);
        pointer-events: none;
        transition:
          opacity .24s cubic-bezier(0.22, 1, 0.36, 1),
          transform .24s cubic-bezier(0.22, 1, 0.36, 1);
      }

      .section-anchor-item:hover .section-anchor-text {
        opacity: 1;
        transform: translate(0, -50%);
      }

      .nav {
        padding: 0 18px;
      }

      .brand span,
      .download {
        display: none;
      }

      .nav-links {
        justify-self: end;
        font-size: 15px;
      }

      .nav-links span,
      .nav-links a {
        width: 84px;
      }

      .nav-links .nav-wide {
        width: 132px;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="section-anchor-nav is-visible" id="sectionAnchorNav">
      <div class="section-anchor-item is-active" data-anchor-target="moreRelicAnchor">
        <span class="section-anchor-dot"></span>
        <span class="section-anchor-text">文物也能当主播</span>
      </div>
    </div>

    <div class="nav">
      <a class="brand" href="index.html">
        <img class="brand-mark" src="assets/figma-portfolio/logo.png" width="28" height="28" alt="" aria-hidden="true" decoding="async" />
        <span>UX 屈畅 · 个人作品集</span>
      </a>
      <span class="nav-links">
        <a href="index.html">首页</a>
        <a href="project-shanbay.html">UX 项目</a>
        <a href="project-visual.html">视觉项目</a>
        <span class="active nav-wide">更多设计实践</span>
        <span>关于我</span>
      </span>
      <span class="download">下载 PDF 作品集</span>
    </div>

    <div class="more-stack">
      <div class="more-block">
        <span class="more-anchor-point" id="moreRelicAnchor"></span>
        <img class="more-img" src="assets/figma-portfolio/more/more1.jpg" width="1920" height="1080" alt="文物也能当主播 广州海事博物馆导览服务设计" loading="eager" fetchpriority="high" decoding="async">
      </div>
    </div>
  </div>
  <script>
    (function() {
      var anchorNav = document.getElementById('sectionAnchorNav');
      if (!anchorNav) return;

      var items = Array.prototype.slice.call(anchorNav.querySelectorAll('[data-anchor-target]'));
      if (!items.length) return;

      var targets = items.map(function(item) {
        var section = document.getElementById(item.getAttribute('data-anchor-target'));
        return {
          item: item,
          section: section
        };
      }).filter(function(entry) {
        return !!entry.section;
      });

      if (!targets.length) return;

      function getPageTop(section) {
        return section.getBoundingClientRect().top + window.scrollY;
      }

      function setActive(targetId) {
        var activeIndex = 0;

        targets.forEach(function(entry, index) {
          var isActive = entry.section.id === targetId;
          entry.item.classList.toggle('is-active', isActive);
          if (isActive) activeIndex = index;
        });

        targets.forEach(function(entry, index) {
          var distance = Math.abs(index - activeIndex);
          entry.item.classList.toggle('is-near-1', distance === 1);
          entry.item.classList.toggle('is-near-2', distance === 2);
          entry.item.classList.toggle('is-near-3', distance === 3);
        });
      }

      function updateAnchorState() {
        var probeY = window.scrollY + 136;
        var currentId = targets[0].section.id;

        targets.forEach(function(entry) {
          if (getPageTop(entry.section) <= probeY) {
            currentId = entry.section.id;
          }
        });

        setActive(currentId);
      }

      targets.forEach(function(entry) {
        entry.item.addEventListener('click', function() {
          var top = getPageTop(entry.section) - 84;
          window.scrollTo({
            top: top < 0 ? 0 : top,
            behavior: 'smooth'
          });
        });
      });

      window.addEventListener('scroll', updateAnchorState, { passive: true });
      window.addEventListener('resize', updateAnchorState);
      updateAnchorState();
    })();
  </script>
</body>
</html>
